# The five original payload files were absent from the import.
# run_course.py generates five distinct deterministic 180KB substitutes.
# Five stalled PUTs require at least five workers; this case uses five.
# 1) Start a PUT request.
# 2) Send a full GET request..
# 3) Finish PUT request body.

[[events]]
type = "LOAD"
infile = "test_files/frankenstein.txt"
outfile = "contended.txt"

[[events]]
type = "CREATE"
method = "PUT"
uri = "contended.txt"
infile = "test_files/generated-payload-0.txt"
id = 0

