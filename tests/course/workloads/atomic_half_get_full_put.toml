# 1) Start a GET request.
# 2) Send a full PUT request..
# 3) Finish GET request body.
# 4) GET the contended file.

[[events]]
type = "LOAD"
infile = "test_files/frankenstein.txt"
outfile = "contended.txt"

[[events]]
type = "CREATE"
method = "GET"
uri = "contended.txt"
id = 0

[[events]]
type = "CREATE"
method = "PUT"
uri = "contended.txt"
infile = "test_files/ipanema.txt"
id = 1

# GET line
[[events]]
type = "SEND_LINE"
id = 0

# GET headers
[[events]]
type = "SEND_HEADERS"
id = 0

# GET body
[[events]]
type = "SEND_BODY"
id = 0

# GET half of body.
[[events]]
type = "RECV_PARTIAL"
size = 750
id = 0

# Completely send PUT request.
[[events]]
type = "SEND_ALL"
id = 1

[[events]]
type = "WAIT"
id = 1

# Wait for other half of body.
[[events]]
type = "WAIT"
id = 0

[[events]]
type = "UNLOAD"
file = "contended.txt"
